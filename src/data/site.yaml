intro: >-
  I build communities and lead companies that grow out of them. My career has been spent putting interesting people in the same room, fighting for the little guy, and building for the communal good. I try to ski 70 days a year and volunteer as much as I can. 
outro: >-
  These days I'm racing Ironman, reading more than I write, and still collecting countries.
